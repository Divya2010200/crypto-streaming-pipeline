services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  create-topics:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic crypto.trades.raw --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic crypto.trades.dead-letter --partitions 1 --replication-factor 1
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crypto
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/create_test_db.sql:/docker-entrypoint-initdb.d/02_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 3s
      retries: 20

  producer:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "pipeline.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
    depends_on:
      create-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.3.0
      - --conf
      - spark.jars.ivy=/ivy
      - --conf
      - spark.sql.shuffle.partitions=3
      - /app/streaming/job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD}@postgres:5432/crypto
      CHECKPOINT_DIR: /checkpoints/trades
    depends_on:
      create-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - spark-checkpoints:/checkpoints
      - spark-ivy:/ivy
    restart: unless-stopped

  report:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    profiles: ["tools"]
    command: ["python", "-m", "pipeline.report"]
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD}@postgres:5432/crypto
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    profiles: ["tools"]
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD}@postgres:5432/crypto_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  spark-ivy:
